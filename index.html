<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Identity</title>
    <link rel="stylesheet" href="styles.css">

    
</head>
<body>

<div class="verify-container">
    <div class="verify-box">

        <h2>Secure Session</h2>
        <p>Enter the 6‑digit code sent to your phone ending in <strong>4821</strong></p>

        <!-- Six code boxes -->
        <div class="code-inputs">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
        </div>

        <!-- Verify button -->
        <a class="verify-btn" href="#">Verify Identity →</a>

        <!-- Links -->
        <div class="verify-links">
            <a href="#">Resend code</a>
            <a href="#">Use another method</a>
            <a href="#">Need help?</a>
        </div>

        <!-- Footer -->
        <p class="verify-footer">256‑bit TLS • Attempt 1 of 5</p>

    </div>
</div>
<script>
    const inputs = document.querySelectorAll('.code-inputs input');

    inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
            // Move to next box when a digit is typed
            if (input.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        input.addEventListener('keydown', (e) => {
            // Allow backspace to move backwards
            if (e.key === 'Backspace' && index > 0 && input.value === '') {
                inputs[index - 1].focus();
            }
        });
    });
</script>

</body>
</html>
