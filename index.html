<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Identity</title>
    <link rel="stylesheet" href="styles.css">

    
</head>
<body>

<div class="verify-container">
    <div class="verify-box">

        <h2>Secure Session</h2>
        <p>Enter the 6‑digit code sent to your phone ending in <strong>4821</strong></p>

        <!-- Six code boxes -->
        <div class="code-inputs">
            <input type="text" maxlength="1" class="digit">
            <input type="text" maxlength="1" class="digit">
            <input type="text" maxlength="1" class="digit">
            <input type="text" maxlength="1" class="digit">
            <input type="text" maxlength="1" class="digit">
            <input type="text" maxlength="1" class="digit">
        </div>

        <!-- Verify button -->
       <a class="verify-btn" onclick="verifyCode()">Verify Identity →</a>

        <!-- Links -->
        <div class="verify-links">
            <a href="#" onclick="alert('Code Sent. Wait 1 minute to Resend')">Resend code</a>
            <a href="#" onclick="alert('You need to setup another method')">Use another method</a>
            <a href="#" onclick="alert('Stay Strong. You are almost done!')">Need help?</a>
        </div>

        <!-- Footer -->
        <p class="verify-footer">256‑bit TLS</p><p id="attempText" class="verify-footer">Attempt 1 of 5</p>

    </div>
</div>
<script>
    let attempts = 1;
    <!-- Advance and backspace each number entry -->
    const digits = document.querySelectorAll('.digit');
    let code = "";

    digits.forEach(input => {
        code += input.value;
    });

    // Check if all 6 digits are entered
    if (code.length === 6 && /^\d{6}$/.test(code)) {
        // SUCCESS → redirect to dashboard
        window.location.href = "https://pnutlicious.github.io/ITT-640-MFA-Dashboard/";
        return;
    }

    // FAILED ATTEMPT
    attempts++;

    // Update attempt text
    document.getElementById("attemptText").innerText = `Attempt ${attempts} of 5`;

    // If attempts reach 5 → lock account
    if (attempts > 5) {
        alert("Account Locked");
        window.location.href = "https://pnutlicious.github.io/ITT-640-MFA-Login/";
        return;
    }

    // Normal failure message
    alert("Incorrect or incomplete code. Try again.");
    <!-- Verify each six digits are entered end -->
</script>

</body>
</html>
