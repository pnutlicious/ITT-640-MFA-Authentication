<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Identity</title>
    <link rel="stylesheet" href="styles.css">

    
</head>
<body>

<div class="verify-container">
    <div class="verify-box">

        <h2>Secure Session</h2>
        <p>Enter the 6‑digit code sent to your phone ending in <strong>4821</strong></p>

        <!-- Six code boxes -->
        <div class="code-inputs">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
        </div>

        <!-- Verify button -->
        <a class="verify-btn" href="https://pnutlicious.github.io/ITT-640-MFA-Dashboard/" onclick="verifyCode()">Verify Identity →</a>

        <!-- Links -->
        <div class="verify-links">
            <a href="#" onclick="alert('Code Sent. Wait 1 minute to Resend')">Resend code</a>
            <a href="#" onclick="alert('You need to setup another method')">Use another method</a>
            <a href="#" onclick="alert('Stay Strong. You are almost done!')">Need help?</a>
        </div>

        <!-- Footer -->
        <p class="verify-footer">256‑bit TLS • Attempt 1 of 5</p>

    </div>
</div>
<script>
    <!-- Advance and backspace each number entry -->
    const inputs = document.querySelectorAll('.code-inputs input');

    inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
            // Move to next box when a digit is typed
            if (input.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        input.addEventListener('keydown', (e) => {
            // Allow backspace to move backwards
            if (e.key === 'Backspace' && index > 0 && input.value === '') {
                inputs[index - 1].focus();
            }
        });
    });
    <!-- Advance and backspace each number entry end -->
    <!-- Verify each six digits are entered  -->
    function verifyCode() {
    const digits = document.querySelectorAll('.digit');
    let code = "";

    digits.forEach(input => {
        code += input.value;
    });

    // Check if all 6 boxes have a digit
    if (code.length === 6 && /^\d{6}$/.test(code)) {
        // Redirect to your URL
        window.location.href = "https://pnutlicious.github.io/ITT-640-MFA-Dashboard/";
    } else {
        alert("Please enter all 6 digits.");
    }
    }
    <!-- Verify each six digits are entered end -->
</script>

</body>
</html>
